<div>
  <p>Full names of the jobs the assistant may propose running, one per line. Empty means none.</p>
  <ul>
    <li><code>team/api-build</code>: one job</li>
    <li><code>team/*</code>: every job directly in the <code>team</code> folder</li>
    <li><code>team/**</code>: every job anywhere under <code>team</code></li>
  </ul>
  <p>People still need the Build permission on a job to run it this way.</p>
</div>
