ConciergePermissions.Group=Concierge
ConciergePermissions.Use=See the Concierge welcome page, learning paths and tours. Everything on them is filtered to what the user can already read.
ConciergePermissions.ManageTours=Change the Concierge welcome message and the "start here" jobs shown to newcomers.
ConciergePermissions.Assistant=Ask the Concierge AI assistant questions, using the provider and key an administrator configured.
ConciergeAction.DisplayName=Concierge

Path.newcomer.title=New to Jenkins
Path.newcomer.intro=The handful of ideas everything else builds on, explained with jobs from this instance.
Path.developer.title=Developer
Path.developer.intro=Find the jobs that build your code, read a failure, and run a build again.
Path.devops.title=DevOps
Path.devops.intro=Where the machinery lives: agents, the queue, plugins and security.

Step.newcomer.job.title=Open a job
Step.newcomer.job.text=A job is a task Jenkins knows how to run, such as building and testing a project. Its page shows how it is doing and every time it ran.
Step.newcomer.build.title=Look at one build
Step.newcomer.build.text=Each run of a job is a build, with a number, a result and the changes that went into it.
Step.newcomer.console.title=Read the console output
Step.newcomer.console.text=The console is the full log of a build. When something fails, the answer is almost always near the end.
Step.newcomer.pipeline.title=See a Pipeline
Step.newcomer.pipeline.text=A Pipeline describes a build as code, usually in a Jenkinsfile next to the project, split into stages you can follow on its page.
Step.newcomer.folders.title=Find your way through folders
Step.newcomer.folders.text=Folders group jobs, often one per team or product. The dashboard lists the top level.
Step.newcomer.agents.title=Meet the agents
Step.newcomer.agents.text=Builds run on agents: machines or containers connected to Jenkins. Each agent has executors, one per build it can run at once.

Step.developer.find.title=Find the jobs for your code
Step.developer.find.text=Use the search box at the top of every page, or browse the dashboard. Job names usually follow the repository or the team.
Step.developer.failure.title=Read a failure
Step.developer.failure.text=Open the console of a failed build and start from the bottom. The first error is usually more useful than the last.
Step.developer.rerun.title=Run a build again
Step.developer.rerun.text="Build Now" in the side panel of a job starts a new build, if you have permission to run it.
Step.developer.parameters.title=Build with parameters
Step.developer.parameters.text=Some jobs ask for values before they start, such as a branch or an environment. Their side panel says "Build with Parameters".
Step.developer.changes.title=See what changed
Step.developer.changes.text=The Changes page of a build lists the commits it included, which is the quickest way to connect a failure to a change.

Step.devops.agents.title=Check the agents
Step.devops.agents.text=Which agents are online, how many executors they have and what they are building right now.
Step.devops.queue.title=Watch the queue
Step.devops.queue.text=Builds waiting for a free executor appear in the build queue on the dashboard. A long queue usually means too few agents.
Step.devops.plugins.title=Review the plugins
Step.devops.plugins.text=Which plugins are installed, which have updates, and which have known security warnings.
Step.devops.log.title=Read the system log
Step.devops.log.text=Errors from Jenkins itself and its plugins, as opposed to errors in a build.
Step.devops.security.title=Understand security
Step.devops.security.text=How people sign in and what they are allowed to do. Concierge only ever shows each person what these settings allow.

Tour.startHere.title=Start here
Tour.startHere.text=The jobs the people who run this instance picked for newcomers, with a note on each.
Tour.dashboard.title=The dashboard
Tour.dashboard.text=Search, the side panel, the job list and the build queue.
Tour.job.title=A job, a build and its log
Tour.job.text=A walk through {0}: its page, its build history, one build and its console.

TourStep.search.title=Search
TourStep.search.text=Open search here, or press Ctrl+K (Cmd+K on a Mac) on any page, then type part of a job name to jump straight to it.
TourStep.sidePanel.title=The side panel
TourStep.sidePanel.text=What you can do on the current page. On the dashboard that includes creating items and managing Jenkins, if you are allowed to.
TourStep.jobList.title=The job list
TourStep.jobList.text=Every job you can see, with its status and when it last succeeded or failed.
TourStep.queue.title=Queue and executors
TourStep.queue.text=Builds waiting to start, and what each agent is building right now.
TourStep.back.title=That is the tour
TourStep.back.text=You are back on the Concierge page. Mark the steps you have done, or take another tour.
TourStep.jobTitle.title=The job page
TourStep.jobTitle.text=The name and status of the job. The weather icon summarises how the last few builds went.
TourStep.jobTasks.title=What you can do
TourStep.jobTasks.text=Build Now starts a build. Configure, Delete and others appear only if you are allowed to use them.
TourStep.history.title=Build history
TourStep.history.text=Every build of this job, newest first. Click one to open it.
TourStep.build.title=One build
TourStep.build.text=Its result, how long it took, what started it and which changes it included.
TourStep.console.title=Console output
TourStep.console.text=The full log of the build. When a build fails, read from the bottom up.
TourStep.pinned.defaultNote=Picked as a good place to start.

