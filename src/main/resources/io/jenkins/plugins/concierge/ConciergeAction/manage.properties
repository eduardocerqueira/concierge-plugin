manage.intro=What newcomers see first on the Concierge page. Each person only sees the pinned jobs they are allowed to read, so one list can serve the whole instance.
welcome.description=Shown at the top of the Concierge page as plain text. Line breaks are kept. Up to 2000 characters.
startHere.description=Up to 12 jobs, in the order newcomers should look at them. They also become the "Start here" tour.
fullName.description=As shown in the job URL, with folders separated by a slash, for example payments/api-build.
